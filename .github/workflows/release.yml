name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v3.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $tag) { throw "Tag $tag does not match Cargo.toml version $version" }

      - name: Run tests
        run: cargo test --locked

      - name: Build executable
        run: cargo build --release --locked

      - name: Smoke test the built executable
        shell: pwsh
        run: |
          $p = Start-Process target\release\TransparencyApp.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Package release zip
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $stage = "release/TransparencyApp-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\TransparencyApp.exe $stage\
          Copy-Item readme.md $stage\README.md
          Copy-Item LICENSE $stage\
          Compress-Archive -Path "$stage\*" -DestinationPath "release\TransparencyApp-$tag.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Transparency App ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: false
          body: >
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            for what changed in this version.
          files: |
            target/release/TransparencyApp.exe
            release/TransparencyApp-*.zip
