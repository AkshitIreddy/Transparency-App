[package]
name = "transparency-app"
version = "3.0.1"
edition = "2021"
description = "Per-window transparency, focus mode and screen dimming for Windows"
license = "MIT"
build = "build.rs"

[[bin]]
name = "TransparencyApp"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
rfd = { version = "0.15", default-features = false }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_ColorSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Storage_Xps",
]

[build-dependencies]
slint-build = "1.19"
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
